kind = "web"
previewPath = "/"
title = "Infinity Gym Kaithal"
version = "1.0.0"
id = "artifacts/infinity-gym"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21636

[services.development]
run = "pnpm --filter @workspace/infinity-gym run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/infinity-gym", "run", "build" ]
serve = "static"
publicDir = "artifacts/infinity-gym/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21636"
BASE_PATH = "/"
